version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # npm dependencies for webui
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "@eslint/js"
        versions: ["10.x.x"]
      - dependency-name: "eslint"
        versions: ["10.x.x"]
      # lucide releases new icons almost daily as minor bumps; only update on major
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
    labels:
      - "dependencies"

  # GitHub Actions versions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
